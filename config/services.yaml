# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

        bind:
            string $projectDir: '%kernel.project_dir%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Migrations/'
            - '../src/Tests/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    Hashids\Hashids:
        arguments:
            - 'infection'
            - 3
            - 'abcdefghijklmnopqrstuvwxyz1234567890'

    # the playground ini disables curl_multi_exec, which the curl client of symfony/http-client needs
    app.github_http_client:
        class: Symfony\Component\HttpClient\NativeHttpClient

    App\Infection\Build\InfectionCommitResolver:
        arguments:
            $httpClient: '@app.github_http_client'

    App\Infection\Build\InfectionSourceBuilder:
        arguments:
            $httpClient: '@app.github_http_client'

    App\Code\CodeSanitizer:
        factory: [ 'App\Code\CodeSanitizerFactory', 'create' ]

    App\Code\ClassesExtractor\ClassesExtractor:
        factory: [ 'App\Code\ClassesExtractor\ClassesExtractorFactory', 'create' ]

when@test:
    services:
        # Without Monolog, Symfony logs errors to stderr. Infection stops the test run
        # on the first stderr output, so the expected 404 in the functional tests would fail it.
        logger:
            class: Psr\Log\NullLogger

        App\Tests\Functional\RefuseHttpRequests: ~

        # public for RefuseHttpRequestsTest: the container removes a service nothing uses
        Symfony\Contracts\HttpClient\HttpClientInterface:
            alias: http_client
            public: true
