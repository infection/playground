; Only the processes that run the submitted code read this file: Infection and what it starts (PHPUnit, the mutants,
; PHPStan, Mago), see App\Infection\ProcessEnvironment::createSandboxed(). The web server and the tools do not need it:
; with curl_multi_exec disabled, symfony/http-client fails and Composer downloads the packages one by one.
disable_functions = exec,passthru,system,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source
