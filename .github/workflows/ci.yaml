name: 'CI: tests, static analysis'

on:
  pull_request:
  merge_group:
  push:
    branches: ['master']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  # Detects whether this merge-group run is redundant (the queued PR is already
  # green, up to date with master and unchanged), so the check jobs below can skip
  # themselves. Inert for other events - see .github/merge-queue-ci-skipper/action.yml.
  merge-queue-ci-skipper:
    name: Merge queue CI skipper
    if: ${{ github.event_name == 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skip-checks: ${{ steps.skipper.outputs.skip-check }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: skipper
        uses: ./.github/merge-queue-ci-skipper

  build:
    name: Tests and static analysis
    runs-on: ubuntu-latest
    needs: [merge-queue-ci-skipper]
    # A skipped job reports as a passing required check. Runs when the skipper is skipped or fails.
    if: ${{ !cancelled() && needs.merge-queue-ci-skipper.outputs.skip-checks != 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/master
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Installed in its own step rather than by the php entrypoint on `up`: a failed download then
      # fails here with Composer's output, instead of killing the container mid-start, which
      # `docker compose up --wait` only reports as "container playground-php-1 is unhealthy".
      - name: Install Composer dependencies
        run: docker compose run --rm --no-deps -v ~/.cache/composer:/root/.cache/composer php composer install --prefer-dist --no-progress --no-interaction

      - name: Start services
        run: docker compose up --wait --no-build

      - name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost/ -o /dev/null

      - name: Check Monaco Editor reachability
        run: curl -v --insecure --fail-with-body https://localhost/monaco/vs/loader.js -o /dev/null

      - name: Install application and DB
        run: make docker-app-reinstall CI=1

      - name: make analyze
        run: make docker-analyze CI=1

      - name: Show container logs
        if: ${{ failure() }}
        run: docker compose logs

  build-prod-image:
    name: Production image build
    runs-on: ubuntu-latest
    needs: [merge-queue-ci-skipper]
    # A skipped job reports as a passing required check. Runs when the skipper is skipped or fails.
    if: ${{ !cancelled() && needs.merge-queue-ci-skipper.outputs.skip-checks != 'true' }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build the production image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: frankenphp_prod
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=prod-${{github.ref}}
          cache-to: type=gha,scope=prod-${{github.ref}},mode=max

  infection:
    name: Changed line mutation tests
    runs-on: ubuntu-latest
    needs: [merge-queue-ci-skipper]
    # A skipped job reports as a passing required check. Runs when the skipper is skipped or fails.
    # Not on push: there is no base to diff the changed lines against.
    if: ${{ !cancelled() && github.event_name != 'push' && needs.merge-queue-ci-skipper.outputs.skip-checks != 'true' }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          # Check out the PR head, not GitHub's merge commit: Infection diffs against the merge-base
          # itself, and the merge commit can be stale right after the PR's base changes.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker images
        uses: docker/bake-action@v7
        with:
          pull: true
          load: true
          source: .
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/master
            *.cache-to=type=gha,scope=${{github.ref}},mode=max

      - name: Cache Composer packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      # Installed in its own step rather than by the php entrypoint on `up`: a failed download then
      # fails here with Composer's output, instead of killing the container mid-start, which
      # `docker compose up --wait` only reports as "container playground-php-1 is unhealthy".
      - name: Install Composer dependencies
        run: docker compose run --rm --no-deps -v ~/.cache/composer:/root/.cache/composer php composer install --prefer-dist --no-progress --no-interaction

      - name: Start services
        run: docker compose up --wait --no-build

      - name: Install application and DB
        run: make docker-app-reinstall CI=1

      - name: Run Infection on changed lines
        env:
          # In the merge queue there is no base_ref; diff against the commit the queue builds on.
          BASE_REF: ${{ github.event.merge_group.base_sha || format('origin/{0}', github.base_ref) }}
        run: make docker-infection-diff CI=1 INFECTION_THREADS=2 BASE_REF="$BASE_REF" ARGS="--no-progress --logger-github --logger-text=php://stdout --log-verbosity=all"

      - name: Show container logs
        if: ${{ failure() }}
        run: docker compose logs
