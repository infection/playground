name: 'Dependabot auto-merge'

on:
  pull_request:

permissions:
  contents: read

jobs:
  # Turns on auto-merge for Dependabot PRs. GitHub then queues the PR into the merge queue
  # once the required checks (see ci.yaml) pass, so a failing build blocks the merge.
  automerge:
    name: Enable auto-merge
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'infection/playground' }}
    runs-on: ubuntu-latest

    steps:
      # Auto-merge must be enabled with a GitHub App token, not GITHUB_TOKEN: GitHub does not
      # start workflow runs for events caused by GITHUB_TOKEN, so a PR it queues never gets a
      # `merge_group` CI run and the merge queue drops it with "no response for status checks".
      # Dependabot-triggered runs only see Dependabot secrets, so both values live there.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.AUTOMERGE_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Enable auto-merge
        run: gh pr merge --auto "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
