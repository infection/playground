version: 2

updates:
  # Every ecosystem waits 7 days after a release before proposing it, so a compromised
  # release is usually yanked before it reaches master. Security updates ignore the cooldown.

  # PHP dependencies: composer.json + composer.lock
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    versioning-strategy: increase
    open-pull-requests-limit: 10
    groups:
      symfony:
        patterns:
          - "symfony/*"
          - "symfonycasts/*"
      doctrine:
        patterns:
          - "doctrine/*"
      dev-tools:
        dependency-type: development
      other:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Base images in the Dockerfile (dunglas/frankenphp, debian)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7

  # Actions used in .github/workflows and the local composite action
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/merge-queue-ci-skipper
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    # This action receives the auto-merge GitHub App private key. On a Dependabot PR the workflow
    # runs from the PR itself, so a bumped version would get the key before anyone reviewed it.
    # Update it by hand after reviewing the release.
    ignore:
      - dependency-name: actions/create-github-app-token
    groups:
      github-actions:
        patterns:
          - "*"
